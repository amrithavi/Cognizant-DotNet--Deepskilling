<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Community Event Portal</title>

    <style>
        body {
            background-color: rgb(85, 148, 221);
        }
    </style>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <h1 id="mainHeader" style="color: red;">
        Local Community Event Portal
    </h1>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Events</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <h2>Upcoming Events</h2>

    <div class="eventCard">
        <h3>Music Festival</h3>
        <p class="content">
            Join the city's annual music festival featuring local artists and performers.
        </p>
    </div>

    <div class="eventCard">
        <h3>Book Fair</h3>
        <p class="content">
            Discover books, meet authors, and participate in reading sessions.
        </p>
    </div>

    <button class="cta-button">
        Register Now
    </button>

</body>
</html>
