<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Box Model Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="eventCard">
        <h2>Music Festival</h2>
        <p>Community music event.</p>
    </div>

    <form>
        <input type="text" class="selectedField" placeholder="enter your name">
    </form>

    <p class="hiddenBox">
        This uses visibility: hidden
    </p>

    <p class="noneBox">
        This uses display: none
    </p>

    <p>
        This text helps compare hidden and none.
    </p>

</body>
</html>
