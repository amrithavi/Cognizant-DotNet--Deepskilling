<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 11</title>

    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h1>exercise 11.1</h1>

        <div class="card" style="width: 20rem;">

            <img src="https://via.placeholder.com/320x200"
                class="card-img-top"
                alt="profile image">

            <div class="card-body">

                <h5 class="card-title">
                    john doe
                </h5>

                <p class="card-text">
                    web developer and designer.
                </p>

                <button class="btn btn-primary">
                    view profile
                </button>

            </div>

        </div>

        <hr class="my-5">

        <h1>exercise 11.2</h1>

        <div class="d-flex align-items-start border p-3">

            <img src="https://via.placeholder.com/100"
                class="me-3"
                alt="user image">

            <div>

                <h5>media object heading</h5>

                <p>
                    this is a media object style layout. the image is
                    aligned to the left and the content appears on the
                    right side.
                </p>

            </div>

        </div>

    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
