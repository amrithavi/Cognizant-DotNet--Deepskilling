<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <style>
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 10px;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>

    <div id="welcomeBanner">
        Welcome to the Local Community Event Portal!
    </div>

    <p class="highlight">
        Registered users get exclusive benefits.
    </p>

    <p>
        <span style="color: red; font-weight: bold;">
            Special Offer: Free event registration this week!
        </span>
    </p>

</body>
</html>
