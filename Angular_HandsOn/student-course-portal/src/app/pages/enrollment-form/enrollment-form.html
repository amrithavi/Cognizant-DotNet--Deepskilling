<h2>Enrollment Request</h2>

<form
    #enrollForm="ngForm"
    (ngSubmit)="onSubmit(enrollForm)">

    <div>

        <label>Student Name</label><br>

        <input
            type="text"
            name="studentName"
            required
            minlength="3"
            [(ngModel)]="studentName"
            #nameCtrl="ngModel">

        <div *ngIf="nameCtrl.touched">

            <small *ngIf="nameCtrl.errors?.['required']">
                Name is required
            </small>

            <small *ngIf="nameCtrl.errors?.['minlength']">
                Name must be at least 3 characters
            </small>

        </div>

    </div>

    <br>

    <div>

        <label>Email</label><br>

        <input
            type="email"
            name="studentEmail"
            required
            email
            [(ngModel)]="studentEmail"
            #emailCtrl="ngModel">

        <div *ngIf="emailCtrl.touched">

            <small *ngIf="emailCtrl.errors?.['required']">
                Email is required
            </small>

            <small *ngIf="emailCtrl.errors?.['email']">
                Enter a valid email
            </small>

        </div>

    </div>

    <br>

    <div>

        <label>Course ID</label><br>

        <input
            type="number"
            name="courseId"
            required
            [(ngModel)]="courseId"
            #courseCtrl="ngModel">

        <div *ngIf="courseCtrl.touched">

            <small *ngIf="courseCtrl.errors?.['required']">
                Course ID is required
            </small>

        </div>

    </div>

    <br>

    <div>

        <label>Preferred Semester</label><br>

        <select
            name="preferredSemester"
            [(ngModel)]="preferredSemester">

            <option>Odd</option>
            <option>Even</option>

        </select>

    </div>

    <br>

    <div>

        <input
            type="checkbox"
            name="agreeToTerms"
            required
            [(ngModel)]="agreeToTerms"
            #termsCtrl="ngModel">

        I agree to the terms and conditions

        <div *ngIf="termsCtrl.touched && termsCtrl.errors?.['required']">

            <small>You must accept the terms.</small>

        </div>

    </div>

    <br>

    <button
        type="submit"
        [disabled]="enrollForm.invalid">

        Submit

    </button>

    <button
        type="button"
        (click)="enrollForm.resetForm()">

        Reset

    </button>

</form>

<div *ngIf="submitted">

    <h3>
        Enrollment request submitted successfully!
    </h3>

</div>
