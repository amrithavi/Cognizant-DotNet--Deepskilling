<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 9</title>

    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h1>exercise 9.1</h1>

        <div class="mb-4">

            <button class="btn btn-primary">primary</button>
            <button class="btn btn-secondary">secondary</button>
            <button class="btn btn-success">success</button>
            <button class="btn btn-danger">danger</button>
            <button class="btn btn-warning">warning</button>
            <button class="btn btn-info">info</button>
            <button class="btn btn-light">light</button>
            <button class="btn btn-dark">dark</button>

        </div>

        <div class="mb-5">

            <button class="btn btn-outline-primary">outline primary</button>
            <button class="btn btn-outline-secondary">outline secondary</button>
            <button class="btn btn-outline-success">outline success</button>
            <button class="btn btn-outline-danger">outline danger</button>

        </div>

        <hr class="my-5">

        <h1>exercise 9.2</h1>

        <h4>button group</h4>

        <div class="btn-group mb-4">
            <button class="btn btn-primary">left</button>
            <button class="btn btn-primary">middle</button>
            <button class="btn btn-primary">right</button>
        </div>

        <h4>toggle buttons</h4>

        <input type="checkbox" class="btn-check" id="option1">
        <label class="btn btn-outline-success" for="option1">
            option 1
        </label>

        <input type="checkbox" class="btn-check" id="option2">
        <label class="btn btn-outline-success" for="option2">
            option 2
        </label>

    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>

</body>

</html>
